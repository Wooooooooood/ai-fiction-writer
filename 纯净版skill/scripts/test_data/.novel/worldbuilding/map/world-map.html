<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苍澜界 - 交互地图</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #333; }
        .meta { color: #666; margin-bottom: 20px; }
        #map { border: 1px solid #ddd; border-radius: 4px; }
        #info { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; min-height: 60px; }
        #info h3 { margin-top: 0; }
        .legend { margin-top: 15px; display: flex; gap: 15px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>苍澜界</h1>
        <div class="meta">层级：世界 | 生成时间：自动生成</div>
        
        <div id="map"><svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#f8f9fa"/>
<text x="20" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">苍澜界 (世界)</text>
<line x1="400" y1="300" x2="160" y2="240" stroke="#999" stroke-width="2" stroke-dasharray="5,3"/>
<text x="280" y="265" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">远洋航线 3个月</text>
<circle cx="560" cy="180" r="25" fill="#50c878" stroke="#333" stroke-width="2" opacity="1.0"/>
<text x="560" y="220" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">东大陆</text>
<text x="560" y="184" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">L1</text>
<circle cx="160" cy="240" r="25" fill="#50c878" stroke="#333" stroke-width="2" opacity="1.0"/>
<text x="160" y="280" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">西大陆</text>
<text x="160" y="244" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle">L1</text>
<text x="20" y="580" font-family="sans-serif" font-size="12" fill="#999">迷雾区域：北境冰原、南海群岛</text>
<text x="650" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">图例</text>
<circle cx="660" cy="81" r="6" fill="#4a90e2"/>
<text x="675" y="85" font-family="sans-serif" font-size="11" fill="#333">世界</text>
<circle cx="660" cy="101" r="6" fill="#50c878"/>
<text x="675" y="105" font-family="sans-serif" font-size="11" fill="#333">区域</text>
<circle cx="660" cy="121" r="6" fill="#f5a623"/>
<text x="675" y="125" font-family="sans-serif" font-size="11" fill="#333">城市</text>
<circle cx="660" cy="141" r="6" fill="#d0021b"/>
<text x="675" y="145" font-family="sans-serif" font-size="11" fill="#333">场景</text>
<circle cx="660" cy="161" r="6" fill="#9013fe"/>
<text x="675" y="165" font-family="sans-serif" font-size="11" fill="#333">细节</text>
<circle cx="660" cy="181" r="6" fill="#cccccc"/>
<text x="675" y="185" font-family="sans-serif" font-size="11" fill="#333">迷雾</text>
</svg></div>
        
        <div id="info">
            <h3>地点详情</h3>
            <p>点击地图上的节点查看详情。</p>
        </div>
        
        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#4a90e2"></div>世界</div>
            <div class="legend-item"><div class="legend-color" style="background:#50c878"></div>区域</div>
            <div class="legend-item"><div class="legend-color" style="background:#f5a623"></div>城市</div>
            <div class="legend-item"><div class="legend-color" style="background:#d0021b"></div>场景</div>
            <div class="legend-item"><div class="legend-color" style="background:#9013fe"></div>细节</div>
            <div class="legend-item"><div class="legend-color" style="background:#cccccc"></div>迷雾</div>
        </div>
    </div>
    
    <script>
        const nodes = [{"name": "东大陆", "level": "L1", "x": 0.7, "y": 0.3}, {"name": "西大陆", "level": "L1", "x": 0.2, "y": 0.4}];
        const connections = [{"from": "东大陆", "to": "西大陆", "method": "远洋航线", "time": "3个月"}];
        const fogAreas = ["北境冰原", "南海群岛"];
        
        document.querySelectorAll('circle').forEach(circle => {
            circle.style.cursor = 'pointer';
            circle.addEventListener('click', function() {
                const text = this.nextElementSibling;
                const name = text ? text.textContent : '未知';
                const node = nodes.find(n => n.name === name);
                const isFog = fogAreas.includes(name);
                
                let html = '<h3>' + name + '</h3>';
                if (node) {
                    html += '<p>层级：' + node.level + '</p>';
                }
                html += '<p>状态：' + (isFog ? '迷雾（未解锁）' : '已解锁') + '</p>';
                
                // 查找连接
                const conn = connections.find(c => c.to === name);
                if (conn) {
                    html += '<p>交通：' + (conn.method || '') + ' ' + (conn.time || '') + '</p>';
                }
                
                document.getElementById('info').innerHTML = html;
            });
        });
    </script>
</body>
</html>
